services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ugtm_ai
      POSTGRES_USER: ugtm_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugtm_ai -d ugtm_ai"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment: &ai_env
      POSTGRES_DSN: postgresql://ugtm_ai:${POSTGRES_PASSWORD}@db:5432/ugtm_ai
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${AI_API_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DATA_DIR: /data
      HF_HOME: /models
      CLASSIFIER_ENABLED: ${CLASSIFIER_ENABLED:-false}
      # Host CLASSIFIER_PATH can be a Windows path; containers use the mounted path.
      CLASSIFIER_PATH: ${DOCKER_CLASSIFIER_PATH:-/artifacts/suspicious_passage_classifier.joblib}
      REMOTE_GPU_URL: ${REMOTE_GPU_URL:-}
      REMOTE_GPU_API_KEY: ${REMOTE_GPU_API_KEY:-}
      REMOTE_GPU_TIMEOUT_SECONDS: ${REMOTE_GPU_TIMEOUT_SECONDS:-180}
      REMOTE_GPU_HEALTH_TIMEOUT_SECONDS: ${REMOTE_GPU_HEALTH_TIMEOUT_SECONDS:-120}
      REMOTE_GPU_BATCH_SIZE: ${REMOTE_GPU_BATCH_SIZE:-32}
      CELERY_QUEUE: ${CELERY_QUEUE:-celery}
      # Explicit opt-in keeps existing local jobs and files on their current backend.
      STORAGE_BACKEND: ${DOCKER_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
    volumes:
      - uploads:/data
      - ./app:/service/app:ro
      - ./artifacts:/artifacts:ro
      - ./frontend/dist:/service/frontend/dist:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --pool=solo -Q ${CELERY_QUEUE:-celery}
    environment: *ai_env
    volumes:
      - uploads:/data
      - ./app:/service/app:ro
      - ./artifacts:/artifacts:ro
      - ./frontend/dist:/service/frontend/dist:ro
      - models:/models
      - ./artifacts:/artifacts:ro
      # Make the migration tool available for existing database volumes.
      - ./scripts:/service/scripts:ro
      - ./sql:/service/sql:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bật khối deploy dưới đây nếu môi trường có GPU NVIDIA và nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
  uploads:
  models:
